<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f0a16">
<meta name="robots" content="noindex">
<title>Award Cauldron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Rozha+One&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: presenter = tab bar + one view (setup, voting, private count, reveal stage); phone = one ballot card stack. Single dark theme. */
  --night:#0f0a16;
  --night-2:#1e1529;
  --line:#3a2c47;
  --paper:#f7ecd8;
  --muted:#b5a690;
  --marigold:#ffb627;
  --kumkum:#e2412b;
  --teal:#3ee0c8;
  --ink:#3a1f0f;
  --display:"Rozha One", Georgia, "Times New Roman", serif;
  --body:"Mukta", "Segoe UI", "Nirmala UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{color:var(--paper);font-family:var(--body);font-size:17px;line-height:1.4;
  background:radial-gradient(ellipse 80% 45% at 50% 118%,rgba(255,182,39,.18),transparent 70%),radial-gradient(circle at 1px 1px,rgba(247,236,216,.06) 1.3px,transparent 1.7px) 0 0/30px 30px,var(--night)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05;text-wrap:balance}
.eyebrow{margin:0;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--night-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--marigold)}
.btn.primary{background:var(--marigold);border-color:var(--marigold);color:#1b1206;font-weight:800}
.btn.danger{border-color:rgba(226,65,43,.5);color:#ff8a7a}
kbd{font-family:var(--body);font-size:.72em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 .4em;color:var(--muted);margin-left:.4em}
.btn.primary kbd{color:#5a3d06;border-color:#c98a10}

/* presenter shell */
body.is-presenter{overflow:hidden}
#presenter{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr}
.pbar{display:flex;align-items:center;gap:14px;padding:8px 18px;border-bottom:1px solid rgba(58,44,71,.6);background:rgba(15,10,22,.8);flex-wrap:wrap;z-index:20}
.brand{font-family:var(--display);font-size:1.2rem;white-space:nowrap}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid transparent;border-radius:999px;padding:4px 14px;color:var(--muted);font-size:.92rem}
.tabs button b{color:var(--marigold);margin-right:6px}
.tabs button[aria-current="true"]{background:var(--night-2);border-color:var(--line);color:var(--paper)}
.tabs button.private::after{content:"private";margin-left:6px;font-size:.7rem;color:#ff8a7a;letter-spacing:.06em;text-transform:uppercase}
.chip{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip[data-s="live"]{color:#7ee36b}.chip[data-s="live"]::before{background:#7ee36b;box-shadow:0 0 10px #7ee36b}
.chip[data-s="wait"]{color:var(--marigold)}.chip[data-s="wait"]::before{background:var(--marigold)}
.chip[data-s="off"]{color:var(--kumkum)}.chip[data-s="off"]::before{background:var(--kumkum)}
.view{overflow:auto;padding:22px clamp(16px,3vw,40px);min-height:0}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.lead{color:var(--muted);margin:0;max-width:70ch}

/* setup */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.qcard{background:linear-gradient(180deg,#221830,#18111f);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.qcard label{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:grid;gap:4px}
.qcard input,.qcard textarea{background:#120c1a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;letter-spacing:0;text-transform:none;font-size:1rem;color:var(--paper)}
.qcard input{font-family:var(--display);font-size:1.3rem}
.qcard textarea{min-height:130px;resize:vertical}
.qcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qcard .n{color:var(--muted);font-size:.85rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:.9rem;margin:0}

/* voting */
.voting{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,60px);align-items:center;max-width:1200px;margin:0 auto;min-height:100%}
.qr{width:min(58vh,42vw);aspect-ratio:1;border-radius:18px;overflow:hidden;box-shadow:0 0 0 8px rgba(255,182,39,.2),0 0 80px rgba(255,182,39,.25)}
.qr svg{display:block;width:100%;height:100%}
.vside{display:flex;flex-direction:column;gap:18px}
.vside h1{font-size:clamp(2.4rem,5vw,4.6rem)}
.vside ol{margin:0;padding-left:1.2em;font-size:clamp(1.1rem,1.8vw,1.5rem);display:grid;gap:6px}
.vside ol li::marker{color:var(--marigold);font-weight:800}
.ballots{font-family:var(--display);font-size:clamp(2rem,4vw,3.4rem);color:var(--marigold);font-variant-numeric:tabular-nums;line-height:1}
.ballots small{font-family:var(--body);font-size:1rem;color:var(--muted);margin-left:10px}
.url{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}

/* count (private) */
.warn{background:rgba(226,65,43,.12);border:1px solid rgba(226,65,43,.5);color:#ffb3a8;border-radius:12px;padding:10px 14px;font-weight:600}
.tally{background:var(--night-2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tally h3{font-size:1.5rem;margin-bottom:8px}
.tally table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:fixed}
.tally th:nth-child(2),.tally td:nth-child(2){width:90px}
.tally th:nth-child(3),.tally td:nth-child(3){width:150px}
.tally th:nth-child(4),.tally td:nth-child(4){width:90px}
.tally th{text-align:left;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.tally td{padding:6px;border-bottom:1px solid rgba(58,44,71,.5)}
.tally td.num{text-align:right;width:70px}
.tally tr.win td{color:var(--marigold);font-weight:800}
.tally tr.win td:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--marigold);margin-right:8px;box-shadow:0 0 8px var(--marigold)}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:30px;height:30px;border-radius:8px;background:#120c1a;border:1px solid var(--line);font-weight:800}
.step span{min-width:24px;text-align:center}

/* reveal stage */
.stage{position:relative;overflow:hidden;padding:0}
#flame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cauldron{position:absolute;left:50%;bottom:-2vh;transform:translateX(-50%);width:min(40vw,52vh);pointer-events:none}
.cauldron svg{display:block;width:100%;height:auto}
.rtitle{position:absolute;left:0;right:0;top:24vh;text-align:center;transition:opacity .6s}
.rtitle h1{font-size:clamp(2.6rem,6vw,5.6rem);background:linear-gradient(90deg,#ffd36b,var(--marigold) 45%,var(--kumkum));-webkit-background-clip:text;background-clip:text;color:transparent}
.rtitle p{margin:10px 0 0;color:var(--muted);font-size:1.1rem}
.parch{position:absolute;left:0;top:0;width:min(560px,70vw);transform-origin:50% 50%;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6));will-change:transform}
.parch .roll{height:26px;border-radius:13px;background:linear-gradient(180deg,#9b7442,#e8cf9c 45%,#a77d47);box-shadow:inset 0 -3px 6px rgba(0,0,0,.25)}
.parch .sheet{display:grid;grid-template-rows:0fr;transition:grid-template-rows 1s cubic-bezier(.3,.7,.2,1);margin:-6px 14px;background:
  radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(ellipse at 80% 90%,rgba(120,70,20,.25),transparent 55%),
  linear-gradient(180deg,#f3e2bb,#e9cf98)}
.parch.open .sheet{grid-template-rows:1fr}
.parch .inner{overflow:hidden;color:var(--ink);text-align:center}
.parch .inner > div{padding:22px 26px 26px}
.parch .cat{margin:0;font-size:.95rem;letter-spacing:.22em;text-transform:uppercase;color:#7a4a1c;font-weight:800}
.parch h2{font-size:clamp(2.2rem,5vw,4rem);margin:10px 0 6px;color:var(--ink)}
.parch .and{font-size:1rem;color:#7a4a1c;margin:0}
.parch .congr{margin:12px 0 0;font-family:var(--display);font-size:1.3rem;color:#a1401c}
.parch .seal{width:46px;height:46px;border-radius:50%;margin:14px auto 0;background:radial-gradient(circle at 35% 35%,#ff7a5c,#b3221a 60%,#7a120c);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.rhint{position:absolute;right:16px;bottom:12px;color:#5e5068;font-size:.8rem}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* phone */
body.is-phone{background:radial-gradient(ellipse 120% 60% at 50% 110%,rgba(255,140,40,.25),transparent 60%),linear-gradient(#07050c,#140c1d 60%,#1d1027);background-attachment:fixed}
#phone{max-width:520px;margin:0 auto;padding:20px 18px 120px;display:flex;flex-direction:column;gap:16px}
.ptop{display:flex;justify-content:space-between;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ptop b{color:var(--marigold)}
.phead h1{font-size:2.3rem}
.phead p{margin:6px 0 0;color:var(--muted)}
.pq{background:linear-gradient(180deg,#241932,#1a1224);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pq h2{font-size:1.6rem}
.pq .done{color:var(--teal);font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#120c1a;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.1rem;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.98)}
.opt i{width:22px;height:22px;border-radius:50%;border:2px solid #6e5f80;flex:none;display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--marigold);background:rgba(255,182,39,.12)}
.opt[aria-checked="true"] i{border-color:var(--marigold)}
.opt[aria-checked="true"] i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--marigold);box-shadow:0 0 8px var(--marigold)}
.cast{position:fixed;left:0;right:0;bottom:0;padding:12px 18px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(7,5,12,.95) 35%);display:flex;justify-content:center}
.cast button{width:100%;max-width:484px;border:0;border-radius:18px;padding:17px;font-size:1.2rem;font-weight:800;color:#1b1206;background:linear-gradient(90deg,#ffd36b,var(--marigold) 50%,#ff8a3d);box-shadow:0 10px 30px rgba(255,140,40,.35)}
.cast button:disabled{filter:grayscale(.7) brightness(.6)}
.cast small{display:block;font-weight:600;font-size:.8rem;opacity:.75}
.pdone{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.pdone h1{font-size:2.6rem}
.pdone p{color:var(--muted);margin:0}
.pdone ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.pdone li b{color:var(--marigold)}
.pmsg{color:var(--muted);text-align:center;margin:0}
.pmsg.warn{color:var(--marigold)}
@media (max-width:820px){.voting{grid-template-columns:1fr;justify-items:center}.qr{width:min(80vw,50vh)}}
@media (prefers-reduced-motion:reduce){.parch .sheet{transition:none}}
</style>
</head>
<body>
<div id="presenter" hidden>
  <header class="pbar">
    <div class="brand">Award Cauldron</div>
    <span class="chip" id="status" data-s="wait">Connecting</span>
    <nav class="tabs" id="tabs" aria-label="Views">
      <button type="button" data-v="setup"><b>1</b>Setup</button>
      <button type="button" data-v="vote"><b>2</b>Voting</button>
      <button type="button" data-v="count" class="private"><b>3</b>Count</button>
      <button type="button" data-v="reveal"><b>4</b>Reveal</button>
    </nav>
    <button type="button" class="btn" id="bFull">Full screen</button>
  </header>
  <main class="view" id="vSetup"></main>
  <main class="view" id="vVote" hidden></main>
  <main class="view" id="vCount" hidden></main>
  <main class="view stage" id="vReveal" hidden>
    <canvas id="flame" aria-hidden="true"></canvas>
    <div class="rtitle" id="rtitle"><h1>And the winners are…</h1><p>Lennox India Toastmasters · Diwali 2026</p></div>
    <div class="cauldron" aria-hidden="true">
      <svg viewBox="0 0 400 260">
        <defs>
          <linearGradient id="iron" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3a3242"/><stop offset="1" stop-color="#121016"/></linearGradient>
          <radialGradient id="glow" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#3ee0c8" stop-opacity=".55"/><stop offset="1" stop-color="#3ee0c8" stop-opacity="0"/></radialGradient>
        </defs>
        <path d="M40 60 Q40 230 200 240 Q360 230 360 60 Z" fill="url(#iron)" stroke="#5a4e66" stroke-width="3"/>
        <ellipse cx="200" cy="60" rx="166" ry="26" fill="#0a080d" stroke="#7a6a88" stroke-width="8"/>
        <path d="M60 120 Q200 150 340 120" fill="none" stroke="#ffb627" stroke-opacity=".35" stroke-width="5"/>
        <path d="M70 175 Q200 205 330 175" fill="none" stroke="#e2412b" stroke-opacity=".3" stroke-width="4"/>
      </svg>
    </div>
    <div id="parchLayer"></div>
    <div class="rhint" id="rhint">Click or Next: reveal the next winner · Back: start over</div>
  </main>
</div>

<div id="phone" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

      _modules = function(moduleCount) {

          }
        }

      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();

      if (_typeNumber >= 7) {

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

        }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {

      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

                  || (r == 0 && c == 0) ) {

    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {

        } else {

        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }

    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

      fl.globalCompositeOperation = "source-over";
    }
    requestAnimationFrame(loop);
  })(0);
  addEventListener("resize", () => { if (view === "reveal") sizeFlame(); });
  function enterReveal() { sizeFlame(); }
  function winnersOf(q) { const rows = tally(q).filter(r => r.win); return rows.map(r => r.name); }
  function resetReveal() { rIdx = -1; current = null; shelf = []; $("#parchLayer").innerHTML = ""; $("#rtitle").style.opacity = 1; $("#rhint").hidden = false; }
  function place(el, x, y, s, rot, dur, easing) {
    return el.animate([{ transform: el.style.transform || getComputedStyle(el).transform }, { transform: `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${rot}deg)` }], { duration: dur, easing: easing || "cubic-bezier(.3,.7,.2,1)", fill: "forwards" }).finished.then(() => { el.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%) scale(${s}) rotate(${rot}deg)`; });
  }
  async function revealNext() {
    if (busy) return; const cats = def.qs.filter(q => q.opts.length);
    audio(); busy = true;
    const stage = $("#vReveal").getBoundingClientRect(), W = stage.width, H = stage.height;
    if (current) {
      const i = shelf.length; shelf.push(current);
      const n = cats.length, x = W * (i + 1) / (n + 1), y = H * 0.1;
      current.classList.add("shelved");
      place(current, x, y, Math.min(.3, 0.9 / n), (i % 2 ? 3 : -3), 900);
      current = null;
    }
    rIdx++;
    if (rIdx >= cats.length) {
      if (rIdx === cats.length) { boom(); chime(); [.2, .5, .8].forEach((f, k) => setTimeout(() => { FX.burst(innerWidth * f, innerHeight * .45, 120, 6.5); boom(); }, 300 + k * 300)); $("#rhint").hidden = true; }
      else { FX.burst(innerWidth * (.2 + Math.random() * .6), innerHeight * .4, 120, 6); boom(); }
      busy = false; return;
    }
    $("#rtitle").style.opacity = 0;
    const q = cats[rIdx], names = winnersOf(q);
    const el = document.createElement("div"); el.className = "parch";
    el.innerHTML = `<div class="roll"></div><div class="sheet"><div class="inner"><div>
      <p class="cat">${esc(q.title)}</p>
      ${names.length ? `<h2>${names.map(esc).join('</h2><p class="and">and</p><h2>')}</h2>` : `<h2>No votes yet</h2>`}
      ${names.length > 1 ? '<p class="and">A tie!</p>' : ""}
      <p class="congr">Congratulations!</p><div class="seal"></div></div></div></div><div class="roll"></div>`;
    $("#parchLayer").appendChild(el);
    const m = mouth();
    el.style.transform = `translate(${m.x}px,${m.y}px) translate(-50%,-50%) scale(.12) rotate(0deg)`;
    // the flame turns, flares, then throws the parchment
    flareUntil = performance.now() + 1500; tone(220, .15, 1.2, "sawtooth", 440); noise(1.2, "highpass", 2500, .25);
    await sleep(reduce ? 50 : 900);
    whoosh(); FX.burst($("#vReveal").getBoundingClientRect().left + m.x, $("#vReveal").getBoundingClientRect().top + m.y, 90, 6, ["#ff7a45", "#ffd36b", "#fff1c1", "#e2412b"]);
    await el.animate([
      { transform: `translate(${m.x}px,${m.y}px) translate(-50%,-50%) scale(.12) rotate(0deg)` },
      { transform: `translate(${W * .5}px,${H * .08}px) translate(-50%,-50%) scale(.38) rotate(560deg)`, offset: .55 },
      { transform: `translate(${W * .5}px,${H * .42}px) translate(-50%,-50%) scale(1) rotate(720deg)` }
    ], { duration: reduce ? 300 : 2100, easing: "cubic-bezier(.25,.6,.25,1)", fill: "forwards" }).finished;
    el.style.transform = `translate(${W * .5}px,${H * .42}px) translate(-50%,-50%) scale(1) rotate(0deg)`;
    el.getAnimations().forEach(a => a.cancel());
    el.classList.add("open"); chime();
    setTimeout(() => { const r = el.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + 20, 80, 5); }, 700);
    current = el; busy = false;
  }
  $("#vReveal").addEventListener("click", revealNext);

  /* --- keys --- */
  function toggleFull() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) { /* not allowed */ } }
  $("#bFull").addEventListener("click", toggleFull);
  document.addEventListener("keydown", e => {
    const tag = (e.target && e.target.tagName) || "";
    if (/^(INPUT|TEXTAREA)$/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (tag === "BUTTON" && (k === "Enter" || k === " ")) return;
    if (view === "reveal" && ["ArrowRight", "PageDown", "Enter", " "].includes(k)) revealNext();
    else if (view === "reveal" && ["ArrowLeft", "PageUp"].includes(k)) resetReveal();
    else if (/^[1-4]$/.test(k)) show(["setup", "vote", "count", "reveal"][+k - 1]);
    else if (k === "f" || k === "F") toggleFull();
    else return;
    e.preventDefault();
  });

  connect(); show(published ? "vote" : "setup");
}

/* ======================= PHONE ======================= */
function phone(topic) {
  document.body.classList.add("is-phone"); const root = $("#phone"); root.hidden = false;
  let dev = store.get("pl-dev", null); if (!dev) { dev = rand(10); store.set("pl-dev", dev); }
  const KEY = "pl-ballot-" + topic;
  let mine = store.get(KEY, { a: {}, sent: false, ver: 0 });
  let def = null, tries = 0;
  const top = `<div class="ptop"><span>Lennox India Toastmasters</span><b>Awards</b></div>`;
  async function load() {
    root.innerHTML = top + `<div class="pdone"><h1>Opening the ballot…</h1><p>One moment.</p></div>`;
    try {
      const r = await fetch(`${RELAY}/${topic}/json?poll=1&since=all`);
      const txt = await r.text(); let last = null;
      txt.split("\n").forEach(line => { try { const m = JSON.parse(line); if (m.event === "message") { const p = JSON.parse(m.message); if (p && p.v === 1 && p.t === "def" && Array.isArray(p.qs)) last = p; } } catch (e) { /* skip */ } });
      def = last;
    } catch (e) { def = null; }
    if (!def) {
      tries++;
      root.innerHTML = top + `<div class="pdone"><h1>Voting hasn't opened yet</h1><p>Hold on. This page checks again by itself.</p><button type="button" class="btn" id="pRetry">Check now</button></div>`;
      $("#pRetry").addEventListener("click", load);
      if (tries < 15) setTimeout(load, 8000);
      return;
    }
    if (mine.sent && mine.ver === def.ver) renderDone(); else render();
  }
  function render(msg) {
    const n = def.qs.length, chosen = def.qs.filter(q => mine.a[q.id]).length;
    root.innerHTML = top + `<div class="phead"><h1>Cast your votes</h1><p>Tap one name in each category. You can change your mind until the reveal.</p></div>
      ${def.qs.map(q => `<section class="pq"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2>${esc(q.title)}</h2>${mine.a[q.id] ? '<span class="done">Chosen</span>' : ""}</div>
        <div class="opts" role="radiogroup" aria-label="${esc(q.title)}">${q.opts.map(o => `<button type="button" class="opt" role="radio" aria-checked="${mine.a[q.id] === o.id}" data-q="${q.id}" data-o="${o.id}"><i></i>${esc(o.name)}</button>`).join("")}</div></section>`).join("")}
      <p class="pmsg${msg ? " warn" : ""}" id="pmsg">${esc(msg || "")}</p>
      <div class="cast"><button type="button" id="pCast" ${chosen ? "" : "disabled"}>Drop my votes in the cauldron<small>${chosen} of ${n} categories chosen</small></button></div>`;
    $$(".opt").forEach(b => b.addEventListener("click", () => {
      mine.a[b.dataset.q] = b.dataset.o; store.set(KEY, mine);
      try { navigator.vibrate && navigator.vibrate(12); } catch (e) { /* ignore */ }
      const r = b.getBoundingClientRect(); FX.burst(r.left + 22, r.top + r.height / 2, 18, 2.4);
      const y = scrollY; render(); scrollTo(0, y);
    }));
    $("#pCast").addEventListener("click", cast);
  }
  async function cast() {
    const btn = $("#pCast"); btn.disabled = true; btn.firstChild.textContent = "Dropping…";
    const a = {}; def.qs.forEach(q => { if (mine.a[q.id] && q.opts.some(o => o.id === mine.a[q.id])) a[q.id] = mine.a[q.id]; });
    let ok = false;
    for (let i = 0; i < 6 && !ok; i++) {
      try { const r = await fetch(`${RELAY}/${topic}`, { method: "POST", body: JSON.stringify({ v: 1, t: "vote", d: dev, ver: def.ver, a }) }); ok = r.ok; if (!ok && r.status === 429) await sleep(6000); } catch (e) { await sleep(2500); }
    }
    if (!ok) { render("Couldn't send. Check your mobile data and try again."); return; }
    mine.sent = true; mine.ver = def.ver; store.set(KEY, mine);
    try { navigator.vibrate && navigator.vibrate([20, 40, 40]); } catch (e) { /* ignore */ }
    renderDone(true);
  }
  function renderDone(fresh) {
    root.innerHTML = top + `<div class="pdone"><h1>Your votes are in the cauldron</h1><p>Watch the big screen for the reveal.</p>
      <ul>${def.qs.filter(q => mine.a[q.id]).map(q => `<li>${esc(q.title)}: <b>${esc((q.opts.find(o => o.id === mine.a[q.id]) || {}).name || "")}</b></li>`).join("")}</ul>
      <button type="button" class="btn" id="pChange">Change my votes</button></div>`;
    $("#pChange").addEventListener("click", () => { mine.sent = false; store.set(KEY, mine); render(); });
    if (fresh) { FX.burst(innerWidth / 2, innerHeight * .3, 110, 6); setTimeout(() => FX.burst(innerWidth * .3, innerHeight * .25, 60, 4), 200); setTimeout(() => FX.burst(innerWidth * .7, innerHeight * .25, 60, 4), 380); }
  }
  load();
}
})();
</script>
